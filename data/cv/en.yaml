summary:
  title: "Summary"
  body: |
    I am an M.S. student at BoanLab, Department of AI Convergence, Dankook University, working on AI infrastructure.
    My work focuses on GPU workloads on Kubernetes: **observing and quantifying GPU interference with eBPF** under
    time-slicing/MPS sharing, and **runtime security for LLM serving** (sidecar gateways, policy automation).

    Training and serving large models ultimately comes down to **how efficiently a handful of GPUs can be driven**.
    That is why I care more about what sits below the framework — schedulers, networking, memory, and kernels — than the framework itself.

