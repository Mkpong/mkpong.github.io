summary:
  title: "Summary"
  body: |
    단국대학교 일반대학원 인공지능융합학과 석사과정(BoanLab)에서 AI 인프라를 연구하고 있습니다.
    Kubernetes 위의 GPU 워크로드를 대상으로, Time-Slicing/MPS 공유 환경에서 생기는 **GPU 간섭을 eBPF로 관측하고 정량화**하는 일과,
    LLM 서빙 환경의 **런타임 보안**(사이드카 게이트웨이, 정책 자동화)을 주로 다룹니다.

    큰 모델을 학습하고 서빙하는 일은 결국 **GPU 몇 장을 얼마나 효율적으로 굴리느냐**의 문제라고 생각합니다.
    그래서 프레임워크보다 그 아래 — 스케줄러, 네트워크, 메모리, 커널 — 에 더 관심이 많습니다.

