baseURL = "https://mkpong.github.io/"
title = "Jaeyoung"
copyright = "© 2026 Jaeyoung"

# ---------- 다국어: / = 한국어, /en/ = 영어 ----------
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
timeZone = "Asia/Seoul"
enableRobotsTXT = true
enableGitInfo = true

# CV 는 단일 페이지 — 블로그 성격의 페이지 종류는 만들지 않음
disableKinds = ["taxonomy", "term", "section", "RSS"]

[languages]
  [languages.ko]
    label = "한국어"
    locale = "ko-KR"
    weight = 1
    title = "Jaeyoung"
    [languages.ko.params]
      description = "AI 인프라를 공부하는 석사과정 학생 Jaeyoung 의 이력서"
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    title = "Jaeyoung"
    [languages.en.params]
      description = "CV of Jaeyoung, an M.S. student working on AI infrastructure"

[outputs]
  home = ["HTML"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Jaeyoung"
  # 내용은 data/cv/ko.yaml, data/cv/en.yaml 에서 편집
  avatar = "https://github.com/mkpong.png"
  github = "https://github.com/mkpong"
  [params.assets]
    favicon = "/favicon.svg"
    theme_color = "#1e1e1e"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
