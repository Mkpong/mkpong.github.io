{{- /* Mermaid: render-codeblock-mermaid.html 이 hasMermaid 를 설정한 페이지에서만 로드.
       PaperMod 다크 모드(body.dark)에 맞춰 테마 선택, 토글 시 재렌더링 */ -}}
{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const sources = new Map();
  document.querySelectorAll("pre.mermaid").forEach((el, i) => {
    el.id ||= `mermaid-${i}`;
    sources.set(el.id, el.textContent);
  });

  const isDark = () => document.body.classList.contains("dark");

  async function render() {
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default" });
    for (const [id, src] of sources) {
      const el = document.getElementById(id);
      if (!el) continue;
      el.textContent = src;
      el.removeAttribute("data-processed");
    }
    await mermaid.run({ nodes: document.querySelectorAll("pre.mermaid") });
  }

  await render();
  document.getElementById("theme-toggle")?.addEventListener("click", () => {
    setTimeout(render, 0);
  });
</script>
{{- end }}
