{{- $p := .page }}{{ $cv := .cv }}
<div class="topbar">
  <div class="controls">
    <div class="lang-switch" role="group" aria-label="{{ $cv.meta.language }}">
      {{- range $p.AllTranslations }}
      <a href="{{ .Permalink }}" hreflang="{{ .Language.Lang }}" data-lang="{{ .Language.Lang }}"
        {{- if eq .Language.Lang $p.Language.Lang }} class="active" aria-current="true"{{ end }}>{{ .Language.Lang | upper }}</a>
      {{- end }}
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" title="{{ $cv.meta.theme }}" aria-label="{{ $cv.meta.theme }}">
      <span class="icon-sun">{{ partial "icon.html" "sun" }}</span>
      <span class="icon-moon">{{ partial "icon.html" "moon" }}</span>
    </button>
    <button class="icon-btn" id="print" type="button" title="{{ $cv.meta.print }}" aria-label="{{ $cv.meta.print }}">
      {{ partial "icon.html" "print" }}<span class="btn-label">{{ $cv.meta.print }}</span>
    </button>
  </div>
</div>
