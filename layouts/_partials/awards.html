{{- /* 수상. 사용: partial "awards.html" $cv.awards */ -}}
<ul class="awards">
  {{- range .items }}
  <li class="award">
    <div class="award-head">
      <span class="award-name">{{ .name }}</span>
      {{- with .year }}<span class="entry-period">{{ . }}</span>{{ end }}
    </div>
    {{- with .org }}<div class="entry-org">{{ . }}</div>{{ end }}
    {{- with .desc }}<div class="entry-desc">{{ . | markdownify }}</div>{{ end }}
  </li>
  {{- end }}
</ul>
