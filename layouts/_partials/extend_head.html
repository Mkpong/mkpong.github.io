{{- /* KaTeX CSS: 수식은 빌드 시 HTML로 렌더링되므로(transform.ToMath) 스타일시트만 필요.
       front matter `math: true`, 사이트 params.math, 또는 렌더 훅이 수식을 감지한 경우 로드 */ -}}
{{- if or .Params.math site.Params.math (.Store.Get "hasMath") }}
<link rel="stylesheet" crossorigin
  href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
